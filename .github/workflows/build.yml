name: Build 3DS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compiler avec arm-none-eabi-gcc
        run: |
          arm-none-eabi-gcc -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -O2 -I/opt/devkitpro/libctru/include main.c -L/opt/devkitpro/libctru/lib -lctru -lm -o main.elf
          3dsxtool main.elf 3ds-gemini.3dsx

      - name: Sauvegarder les artéfacts
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Gemini-CIA
          path: |
            3ds-gemini.3dsx
            main.elf
