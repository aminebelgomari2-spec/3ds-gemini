name: Build 3DS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/pacs:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compiler le projet
        run: |
          make

      - name: Sauvegarder les artéfacts
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Gemini-CIA
          path: |
            *.cia
            *.3dsx
