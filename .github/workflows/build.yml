name: Build 3DS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installer devkitPro pacman
        uses: devkitPro/actions/install@v2

      - name: Installer les dépendances 3DS
        run: |
          dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Compiler le projet
        run: |
          make

      - name: Sauvegarder les artéfacts
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Gemini-Files
          path: |
            *.3dsx
            *.cia
