name: Build 3DS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurer les clés devkitPro
        run: |
          doption() { echo "$1"; }
          curl -LO https://pkg.devkitpro.org/devkitpro-keyring.pkg.tar.xz
          dkm-pacman -U --noconfirm devkitpro-keyring.pkg.tar.xz || dkp-pacman -U --noconfirm devkitpro-keyring.pkg.tar.xz || pacman -U --noconfirm devkitpro-keyring.pkg.tar.xz

      - name: Installer les outils 3DS
        run: |
          dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Compiler le projet
        run: |
          make

      - name: Sauvegarder les artéfacts
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Gemini-CIA
          path: |
            *.cia
            *.3dsx
