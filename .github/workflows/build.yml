name: Build 3DS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installer les dépendances et devkitPro
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2 make
          
          # Téléchargement et installation de devkitPro pacman
          wget https://apt.devkitpro.org/devkitpro-pacman.pkg
          sudo dkp-pacman -U --noconfirm devkitpro-pacman.pkg || true

      - name: Compiler le projet
        run: |
          make

      - name: Sauvegarder les artéfacts
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Gemini-Files
          path: |
            *.3dsx
            *.cia
